map $uri $preview_log_path {
    ~^/accounts/recovery/ /accounts/recovery/[REDACTED];
    default $uri;
}
log_format preview_safe '$remote_addr "$request_method $preview_log_path $server_protocol" $status $body_bytes_sent';
# This exact public hostname terminates TLS at Cloudflare. Never trust arbitrary
# client-supplied X-Forwarded-Proto; direct localhost/Tailscale stays HTTP.
map $host $preview_origin_scheme {
    default $scheme;
    ui.jinnuu.site https;
}
map $host $preview_cookie_security {
    default nosecure;
    ui.jinnuu.site secure;
}
limit_req_zone $binary_remote_addr zone=preview_login:10m rate=10r/m;
server {
    listen 8080;
    server_name _;
    access_log /var/log/nginx/access.log preview_safe;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $snp_backend http://web:8000;
    proxy_cookie_flags snp_ui_preview_session $preview_cookie_security;
    proxy_cookie_flags snp_ui_preview_csrf $preview_cookie_security;
    client_max_body_size 20m;
    add_header X-Content-Type-Options nosniff always;
    location = /healthz { access_log off; return 200 'ok\n'; add_header Content-Type text/plain; }
    location /static/ { alias /srv/static/; expires 1h; access_log off; }
    location = /accounts/login/ {
        limit_req zone=preview_login burst=30 nodelay;
        proxy_pass $snp_backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-SNP-Log-Path $preview_log_path;
        proxy_set_header X-Forwarded-Proto $preview_origin_scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 190s;
    }
    location ^~ /accounts/recovery/ {
        # Upstream diagnostics can otherwise repeat token-bearing request URIs.
        error_log /dev/null;
        proxy_pass $snp_backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-SNP-Log-Path $preview_log_path;
        proxy_set_header X-Forwarded-Proto $preview_origin_scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 190s;
    }
    location / {
        proxy_pass $snp_backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-SNP-Log-Path $preview_log_path;
        proxy_set_header X-Forwarded-Proto $preview_origin_scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 190s;
    }
}

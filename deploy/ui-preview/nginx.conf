limit_req_zone $binary_remote_addr zone=preview_login:10m rate=10r/m;
server {
    listen 8080;
    server_name _;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $snp_backend http://web:8000;
    client_max_body_size 20m;
    add_header X-Content-Type-Options nosniff always;
    location = /healthz { access_log off; return 200 'ok\n'; add_header Content-Type text/plain; }
    location /static/ { alias /srv/static/; expires 1h; access_log off; }
    location = /accounts/login/ {
        limit_req zone=preview_login burst=30 nodelay;
        proxy_pass $snp_backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 190s;
    }
    location / {
        proxy_pass $snp_backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 190s;
    }
}
